<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05060f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stretch">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <title>Stretch Timer</title>
</head>
<body data-phase="idle">
  <!-- animated aurora background -->
  <div class="aurora" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
    <span class="orb orb-c"></span>
    <div class="grain"></div>
  </div>

  <!-- ============ CONFIG SCREEN ============ -->
  <main id="config-screen" class="screen is-active">
    <header class="brand">
      <div class="logo-ring"><div class="logo">🧘</div></div>
      <h1>Stretch<span>.</span></h1>
      <p class="subtitle">Hold · recover · alternate sides</p>
    </header>

    <section class="glass card">
      <div class="field">
        <label for="cfg-hold">Hold <small>seconds</small></label>
        <div class="stepper">
          <button type="button" data-target="cfg-hold" data-step="-5" aria-label="decrease hold">−</button>
          <input id="cfg-hold" type="number" inputmode="numeric" value="30" min="5" max="300" step="5">
          <button type="button" data-target="cfg-hold" data-step="5" aria-label="increase hold">+</button>
        </div>
      </div>

      <div class="field">
        <label for="cfg-recover">Recovery <small>switch sides</small></label>
        <div class="stepper">
          <button type="button" data-target="cfg-recover" data-step="-1">−</button>
          <input id="cfg-recover" type="number" inputmode="numeric" value="5" min="1" max="60" step="1">
          <button type="button" data-target="cfg-recover" data-step="1">+</button>
        </div>
      </div>

      <div class="field">
        <label for="cfg-rest">Rest between sides <small>0 = off</small></label>
        <div class="stepper">
          <button type="button" data-target="cfg-rest" data-step="-5">−</button>
          <input id="cfg-rest" type="number" inputmode="numeric" value="0" min="0" max="120" step="5">
          <button type="button" data-target="cfg-rest" data-step="5">+</button>
        </div>
      </div>

      <div class="field">
        <label for="cfg-stretches">Stretches <small>exercises</small></label>
        <div class="stepper">
          <button type="button" data-target="cfg-stretches" data-step="-1">−</button>
          <input id="cfg-stretches" type="number" inputmode="numeric" value="1" min="1" max="12" step="1">
          <button type="button" data-target="cfg-stretches" data-step="1">+</button>
        </div>
      </div>

      <div class="field">
        <label for="cfg-reps">Rounds <small>per stretch</small></label>
        <div class="stepper">
          <button type="button" data-target="cfg-reps" data-step="-1">−</button>
          <input id="cfg-reps" type="number" inputmode="numeric" value="10" min="1" max="20" step="1">
          <button type="button" data-target="cfg-reps" data-step="1">+</button>
        </div>
      </div>
    </section>

    <section class="glass card toggles">
      <label class="toggle" for="opt-voice"><span>🔊 Voice cues</span><input type="checkbox" id="opt-voice" checked><span class="switch"></span></label>

      <div class="engine-row">
        <span class="engine-label">Voice engine</span>
        <div class="segmented" role="tablist">
          <button type="button" class="seg is-active" data-engine="system">System</button>
          <button type="button" class="seg" data-engine="premium">Premium</button>
        </div>
      </div>

      <div class="select-row" id="voice-row">
        <label for="cfg-voice">System voice</label>
        <select id="cfg-voice" class="glass-select"></select>
      </div>

      <div class="premium-panel" id="premium-panel" hidden>
        <div class="select-row">
          <label for="cfg-tts-voice">OpenAI voice</label>
          <select id="cfg-tts-voice" class="glass-select">
            <option value="nova">Nova · warm female</option>
            <option value="coral">Coral · warm female</option>
            <option value="sage">Sage · calm female</option>
            <option value="shimmer">Shimmer · soft female</option>
            <option value="ballad">Ballad · gentle</option>
            <option value="alloy">Alloy · neutral</option>
            <option value="verse">Verse · neutral</option>
            <option value="echo">Echo · warm male</option>
            <option value="ash">Ash · deep male</option>
            <option value="onyx">Onyx · deep male</option>
            <option value="fable">Fable · expressive</option>
          </select>
        </div>
        <div class="select-row">
          <label for="cfg-tts-model">Model</label>
          <select id="cfg-tts-model" class="glass-select">
            <option value="gpt-4o-mini-tts">gpt-4o-mini-tts · most natural</option>
            <option value="tts-1-hd">tts-1-hd · high quality</option>
            <option value="tts-1">tts-1 · lowest latency</option>
          </select>
        </div>
        <div class="key-row">
          <label for="cfg-api-key">OpenAI API key</label>
          <input id="cfg-api-key" type="password" placeholder="sk-…" autocomplete="off" spellcheck="false">
        </div>
        <p class="key-note">🔒 Stored only in this browser. Sent only to api.openai.com. Never committed to the repo.</p>
        <div class="premium-actions">
          <button type="button" id="test-voice-btn" class="ctrl small"><span>▶ Test voice</span></button>
          <span id="tts-status" class="tts-status"></span>
        </div>
      </div>

      <label class="toggle" for="opt-beeps"><span>⏱️ Countdown beeps</span><input type="checkbox" id="opt-beeps" checked><span class="switch"></span></label>
      <label class="toggle" for="opt-vibrate"><span>📳 Vibration</span><input type="checkbox" id="opt-vibrate" checked><span class="switch"></span></label>
      <label class="toggle" for="opt-music"><span>🎵 Background music</span><input type="checkbox" id="opt-music"><span class="switch"></span></label>
      <div class="vol-row" id="vol-row" hidden>
        <label for="cfg-vol">Volume</label>
        <input id="cfg-vol" type="range" min="0" max="1" step="0.05" value="0.35">
        <span id="vol-val" class="vol-val">35%</span>
      </div>
    </section>

    <p class="summary" id="summary"></p>

    <button id="start-btn" class="primary"><span>Start</span></button>
    <p class="hint">Screen stays awake · saved on this device</p>
  </main>

  <!-- ============ RUN SCREEN ============ -->
  <main id="run-screen" class="screen">
    <div class="run-header">
      <span id="stretch-label" class="chip">Stretch 1 / 1</span>
      <span id="round-label" class="chip">Round 1 / 10</span>
    </div>

    <div class="ring-wrap">
      <svg viewBox="0 0 320 320" class="ring" id="ring-svg" aria-hidden="true">
        <defs>
          <linearGradient id="ring-grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"  stop-color="#ff7a7a"/>
            <stop offset="100%" stop-color="#ff3d6e"/>
          </linearGradient>
        </defs>
        <circle class="ring-bg" cx="160" cy="160" r="140"></circle>
        <circle class="ring-fg" id="ring-fg" cx="160" cy="160" r="140" pathLength="100"></circle>
        <circle class="ring-glow" id="ring-glow" cx="160" cy="160" r="140"></circle>
      </svg>
      <div class="ring-center">
        <span id="side-badge" class="side-badge">LEFT</span>
        <span id="time" class="time">30</span>
        <span id="phase-label" class="phase-label">STRETCH</span>
      </div>
    </div>

    <div class="controls">
      <button id="pause-btn" class="ctrl"><span>⏸ Pause</span></button>
      <button id="skip-btn" class="ctrl"><span>⏭ Skip</span></button>
      <button id="stop-btn" class="ctrl danger"><span>⏹ Stop</span></button>
    </div>
  </main>

  <!-- ============ DONE OVERLAY ============ -->
  <div id="done-overlay" class="overlay">
    <div class="overlay-card glass">
      <div class="done-emoji">🎉</div>
      <h2>All done!</h2>
      <p id="done-stats">Great job. See you next stretch.</p>
      <button id="done-reset" class="primary"><span>Back to setup</span></button>
    </div>
  </div>

  <audio id="bg-audio" src="audio/happy-summer-116584.mp3" loop preload="auto"></audio>
  <script src="app.js"></script>
</body>
</html>
